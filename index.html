<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>倒立振子制御シミュレータ | 身近な例から学ぶ制御工学</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- カスタムスタイル（完全自立型レスポンシブ） -->
  <link rel="stylesheet" href="css/style.css?v=20261029_ipad_1">
</head>
<body class="bg-slate-50 text-slate-900 app-layout select-none antialiased">

  <!-- ==================== ヘッダー ==================== -->
  <header class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2 flex items-center justify-between shrink-0 z-30 h-11 sm:h-12">
    <div class="flex items-center space-x-2">
      <!-- ハンバーガーメニューボタン -->
      <button type="button" id="btn-menu-toggle" class="p-1 -ml-1 text-slate-700 hover:bg-slate-100 active:bg-slate-200 rounded transition flex items-center justify-center touch-target-min" aria-label="設定とステップ遷移">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <h1 class="text-xs sm:text-sm md:text-base font-semibold tracking-tight text-slate-800 flex items-center space-x-1.5">
        <span>倒立振子シミュレータ</span>
      </h1>
    </div>

    <!-- 再生/停止 & リセット（デフォルトは停止状態） -->
    <div class="flex items-center space-x-1.5">
      <button type="button" id="btn-play-pause" class="px-3 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-md hover:bg-slate-800 active:bg-slate-950 transition flex items-center shadow-sm touch-target-min">
        <svg class="w-3.5 h-3.5 mr-1.5" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
        <span>再生</span>
      </button>
      <button type="button" id="btn-reset" class="px-2.5 sm:px-3 py-1.5 text-xs font-medium bg-white text-slate-700 border border-slate-200 rounded-md hover:bg-slate-100 active:bg-slate-200 transition flex items-center touch-target-min">
        <svg class="w-3.5 h-3.5 mr-1.5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>リセット</span>
      </button>
    </div>
  </header>

  <!-- ==================== メインレイアウト ==================== -->
  <div class="main-content">

    <!-- 1. シミュレータペイン（スマホ時は上部固定、PC時は右ペイン） -->
    <main class="simulator-pane">
      
      <!-- Canvas描画領域（確実な高さを保持） -->
      <div class="canvas-container">
        <canvas id="simulation-canvas"></canvas>
      </div>

      <!-- リアルタイム・状態モニターバー（繊細で上品なインジケータ） -->
      <div class="monitor-bar">
        <div class="monitor-grid">
          <div class="monitor-item">
            <span class="monitor-label">角度</span>
            <span id="monitor-angle" class="monitor-val font-mono whitespace-pre">+ 15.0°</span>
          </div>
          <div class="monitor-item">
            <span class="monitor-label">位置</span>
            <span id="monitor-pos" class="monitor-val font-mono whitespace-pre">+  0.00m</span>
          </div>
          <div class="monitor-item">
            <span class="monitor-label">力</span>
            <span id="monitor-force" class="monitor-val font-mono whitespace-pre">+ 0.0N</span>
          </div>
        </div>
      </div>

    </main>

    <!-- 2. 操作・解説パネル（スマホ時は下部スクロール、PC時は左ペイン） -->
    <aside class="controls-pane px-4 py-3 sm:px-5 sm:py-4 space-y-4">
      
      <!-- 【外乱操作】枠線をなくしたミニマル＆スタイリッシュな操作エリア -->
      <section class="disturb-section">
        <div class="flex items-center justify-between text-xs font-medium text-slate-500 mb-1.5">
          <span>外乱入力</span>
          <span id="val-disturb-strength" class="font-mono font-semibold text-slate-800 text-xs">2.0N</span>
        </div>
        <div class="flex items-center gap-2">
          <!-- 左押しボタン -->
          <button type="button" id="btn-disturb-left" class="disturb-btn bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 rounded-lg flex items-center justify-center transition" title="左から押す">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"/>
            </svg>
          </button>

          <!-- スライダー & ステッパー -->
          <div class="flex-1 flex items-center gap-2 min-w-0">
            <button type="button" id="btn-disturb-minus" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 rounded-md text-xs font-bold flex items-center justify-center shrink-0 transition">−</button>
            <input type="range" id="slider-disturb-strength" min="0.5" max="5.0" step="0.5" value="2.0" class="clean-slider flex-1 h-1.5 bg-slate-200 rounded appearance-none cursor-pointer accent-slate-900">
            <button type="button" id="btn-disturb-plus" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 rounded-md text-xs font-bold flex items-center justify-center shrink-0 transition">＋</button>
          </div>

          <!-- 右押しボタン -->
          <button type="button" id="btn-disturb-right" class="disturb-btn bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 rounded-lg flex items-center justify-center transition" title="右から押す">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- ステップタイトル & ミッション（※指定通りそのまま維持） -->
      <section class="border-t border-slate-100 pt-3">
        <h2 id="step-title" class="text-sm md:text-base font-bold text-slate-800 mb-1">
          Step 0: 自然落下（制御なし）
        </h2>
        <div class="bg-slate-50 border-l-2 border-slate-700 p-2.5 sm:p-3 rounded-r text-xs text-slate-700 space-y-1">
          <div class="font-semibold text-slate-900 text-xs">ミッション</div>
          <p id="step-mission" class="leading-relaxed">
            再生ボタンを押して、初期の傾きから傘がどのように倒れるか観察してみよう。傘の初期傾きや長さ・重さは左上のメニュー（≡）から自由に変更できます。
          </p>
        </div>
      </section>

      <!-- パラメータ調整（ボックスを多用せずスタイリッシュに） -->
      <section class="border-t border-slate-100 pt-3">
        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">パラメータ調整</div>
        <div id="params-container" class="space-y-2.5">
          <!-- stepManager.jsで動的生成 -->
        </div>
      </section>

      <!-- メイン画面用 ステップ進行ボタン -->
      <section class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2.5">
        <button type="button" class="btn-prev-step-action hidden px-3.5 py-2 text-xs font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 active:bg-slate-300 rounded-lg transition text-center touch-target-min">
          ◀ 前のステップ
        </button>
        <button type="button" class="btn-next-step-action w-full px-4 py-2.5 text-xs md:text-sm font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-800 active:bg-slate-950 transition text-center touch-target-min shadow-sm">
          次のステップ (Step 1) ➔
        </button>
      </section>

      <!-- 下部スクロールバッファ（確実に最下部まで操作可能にする余白） -->
      <div class="h-16 sm:h-20 w-full" aria-hidden="true"></div>

    </aside>

  </div>

  <!-- ==================== ハンバーガーメニュー ==================== -->
  <div id="drawer-backdrop" class="fixed inset-0 bg-slate-900/40 z-40 hidden transition-opacity duration-200 opacity-0"></div>
  
  <aside id="side-drawer" class="fixed top-0 left-0 bottom-0 w-[82vw] max-w-xs bg-white z-50 shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-200 ease-out border-r border-slate-200">
    
    <div class="p-3 border-b border-slate-200 flex items-center justify-between shrink-0 bg-slate-50">
      <div class="flex items-center space-x-2">
        <div class="w-2 h-2 bg-slate-800 rounded-sm"></div>
        <h2 class="text-xs sm:text-sm font-semibold text-slate-800">ステップ選択・ パラメータ設定</h2>
      </div>
      <button type="button" id="btn-drawer-close" class="p-1 text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded transition" aria-label="閉じる">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="flex-1 custom-scroll p-3.5 space-y-4 pb-16">
      
      <!-- ステップ遷移ボタン群 -->
      <section>
        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">ステップ選択</div>
        <div id="step-nav-container" class="flex flex-wrap gap-1.5">
          <!-- stepManager.jsで動的生成 -->
        </div>
      </section>

      <!-- 物理パラメータ（質量・長さ・初期傾き）設定 -->
      <section class="border-t border-slate-100 pt-3">
        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">パラメータ設定</div>
        <div id="physics-params-container" class="space-y-1.5">
          <!-- stepManager.jsで動的生成 -->
        </div>
      </section>

    </div>

  </aside>

  <!-- スクリプト群読み込み -->
  <script src="js/physics.js?v=20261029_ipad_1"></script>
  <script src="js/controller.js?v=20261029_ipad_1"></script>
  <script src="js/renderer.js?v=20261029_ipad_1"></script>
  <script src="js/stepManager.js?v=20261029_ipad_1"></script>
  <script src="js/main.js?v=20261029_ipad_1"></script>
</body>
</html>
